name: Daily 8 AM Cron

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily job started at 8 AM!"

      - name: Current Date and Time
        run: date

      - name: Completion Message
        run: echo "Daily job completed successfully!"
